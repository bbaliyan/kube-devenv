name: Build and publish image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - tasks.json

permissions:
  contents: write        # required to create the GitHub Release
  packages: write
  id-token: write        # required for keyless signing behind the attestation actions below
  attestations: write    # required to publish to this repo's Attestations page
  security-events: write # required for Trivy SARIF upload to Security tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kube-devenv
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBE_DEVENV_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install Trivy from the same version pinned in the Dockerfile ARG —
      # single source of truth, consistent between local dev and CI.
      - name: Install Trivy
        if: github.event_name != 'pull_request'
        run: |
          TRIVY_VERSION=$(grep 'ARG TRIVY_VERSION=' Dockerfile | cut -d= -f2)
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy image scan
        if: github.event_name != 'pull_request'
        run: |
          trivy image \
            --format sarif --output trivy.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            ghcr.io/${{ github.repository_owner }}/kube-devenv@${{ steps.build.outputs.digest }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      # GitHub's native Artifact Attestations, not raw cosign: GHCR doesn't
      # implement the OCI Referrers API, so cosign-attached or buildx-native
      # (provenance:true/sbom:true) attestations have nowhere to surface —
      # they're invisible in any UI and only reachable via raw digest lookups.
      # actions/attest-* instead publish to GitHub's own Attestations store
      # (visible at /attestations on this repo) and verify with a plain
      # `gh attestation verify oci://ghcr.io/... --owner bbaliyan` — no need
      # to know Fulcio issuer URLs or identity regexes. Reuses Trivy (already
      # installed above) to generate the SBOM these get built from.
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: |
          trivy image --format spdx-json --output sbom.spdx.json \
            ghcr.io/${{ github.repository_owner }}/kube-devenv@${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kube-devenv
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kube-devenv
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json

      # Dependency version matrix: what's actually installed in this specific
      # tag, not just what the Dockerfile's ARGs intended. Runs the just-built
      # image itself rather than parsing the Dockerfile, so it's accurate for
      # aws-cli/az-cli/session-manager-plugin too — those track upstream
      # "latest" at build time rather than a Renovate-pinned ARG.
      - name: Generate dependency version matrix
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Dependency versions"
            echo
            docker run --rm -i --platform linux/amd64 \
              ghcr.io/${{ github.repository_owner }}/kube-devenv@${{ steps.build.outputs.digest }} \
              bash -s < .github/scripts/dump-versions.sh
          } > versions.md

      # Only runs for an actual tag push (this workflow's only non-PR trigger),
      # and only once everything above has succeeded — a Release is the
      # "this build is good" stamp, not something to create on a partial run.
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          body_path: versions.md
          generate_release_notes: true
