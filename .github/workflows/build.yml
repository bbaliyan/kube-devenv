name: Build and publish image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - tasks.json

permissions:
  contents: write        # required to create the GitHub Release
  packages: write
  id-token: write        # required for cosign keyless signing
  security-events: write # required for Trivy SARIF upload to Security tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kube-devenv
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBE_DEVENV_VERSION=${{ steps.meta.outputs.version }}
          # Native buildx SBOM + provenance attestations — the format GHCR's
          # package page reads to render its own "SBOM" / "Provenance" tabs
          # (what software + versions are in the image), distinct from the
          # Trivy SARIF scan below (whether that software has known CVEs).
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install Trivy from the same version pinned in the Dockerfile ARG —
      # single source of truth, consistent between local dev and CI.
      - name: Install Trivy
        if: github.event_name != 'pull_request'
        run: |
          TRIVY_VERSION=$(grep 'ARG TRIVY_VERSION=' Dockerfile | cut -d= -f2)
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy image scan
        if: github.event_name != 'pull_request'
        run: |
          trivy image \
            --format sarif --output trivy.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            ghcr.io/${{ github.repository_owner }}/kube-devenv@${{ steps.build.outputs.digest }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      # cosign keyless signing (requires id-token: write above). SBOM/provenance
      # attestations are handled natively by build-push-action above, not here.
      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Sign
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/kube-devenv@${{ steps.build.outputs.digest }}

      # Only runs for an actual tag push (this workflow's only non-PR trigger),
      # and only once everything above has succeeded — a Release is the
      # "this build is good" stamp, not something to create on a partial run.
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
