name: Scheduled image scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The published image holds the scanner, so the scan runs the same
      # tools consumers get.
      - name: Scan the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          docker run --rm \
            -e GH_TOKEN -e GH_REPO \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_REPOSITORY_OWNER="$GITHUB_REPOSITORY_OWNER" \
            -e GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v "$PWD":/workspace \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/kube-devenv:latest" \
            make scan-image
